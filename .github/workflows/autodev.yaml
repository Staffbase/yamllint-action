---
name: Autodev

on:
  push:
    branches-ignore: [dev]
  pull_request:
    types: [labeled, unlabeled, closed]

jobs:
  autodev:
    uses: Staffbase/gha-workflows/.github/workflows/template_autodev.yml@a77e81bbab1411061ac4d8f90773387934b9e3d9 # v20.1.0
    with:
      labels: true
    secrets:
      client_id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
      private_key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
